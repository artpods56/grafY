[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-api"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "authlib>=1.7.2",
    "cryptography>=45.0.0",
    "fastapi>=0.123.0",
    "httpx>=0.28.0",
    "keyring>=25.7.0",
    "grafy-core",
    "grafy-persistence",
    "grafy-workbench",
    "grafy-storage",
    "pillow",
    "pydantic",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "starlette<1.0.0",
    "structlog>=25.5.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.38.0",
    "ijson>=3.5.1",
]

[project.scripts]
grafy = "grafy_api.cli:main"

[tool.uv.sources]
grafy-core = { workspace = true }
grafy-persistence = { workspace = true }
grafy-workbench = { workspace = true }
grafy-storage = { workspace = true }

[tool.basedpyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
