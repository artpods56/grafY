[project]
name = "grafy-tiler"
version = "0.1.0"
description = "Internal raster tile service for Grafy (TiTiler building blocks, GDAL)"
requires-python = "==3.13.*"
dependencies = [
    "grafy-crypto",
    "titiler.core==2.4.0",
    "rio-tiler==9.4.13",
    "pydantic-settings>=2.10",
    "uvicorn>=0.38.0",
    "rasterio>=1.5.2",
]

# This project has its own lock on purpose: it targets Python 3.13 while the
# root uv workspace targets Python 3.14. It is not a member of that workspace.
[tool.uv]
package = true

[tool.uv.sources]
grafy-crypto = { path = "../../libs/crypto" }

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.6",
    "pyright>=1.1.411",
    "pillow>=11",
    "moto[s3,server]>=5.1",
    "types-rasterio>=1.5.2.20261029",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../libs/crypto/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
timeout = 120
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    "ignore::rio_tiler.errors.NoOverviewWarning",
]
markers = [
    "container: needs a Docker daemon and GRAFY_TEST_TILER_IMAGE",
]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# rasterio's stubs come from types-rasterio (dev group). Strict mode still
# reports ~50 partially-unknown values from numpy and rio-tiler, so the project
# stays on standard mode.
typeCheckingMode = "standard"
reportMissingTypeStubs = false
include = ["src", "tests", "../../libs/crypto"]
extraPaths = ["src", "../../libs/crypto/src"]
