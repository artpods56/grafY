name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to main must not cancel the publish of an earlier green commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grafy
          POSTGRES_USER: grafy
          POSTGRES_PASSWORD: grafy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username grafy --dbname grafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: docker/setup-docker-action@v5
        with:
          version: v28.4.0
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Install native GIS contract tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdal-bin
      - name: Install locked Python workspace
        run: uv sync --locked
      - name: Verify fresh PostgreSQL migration
        env:
          GRAFY_TEST_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
        run: >-
          uv run pytest -q -o log_cli=false
          tests/unit/persistence/test_migrations.py::test_fresh_postgresql_database_upgrades_to_head
      - name: Verify PostgreSQL persistence contracts
        env:
          GRAFY_TEST_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
          GRAFY_TEST_TRANSIENT_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
        run: >-
          uv run pytest -q -o log_cli=false tests/unit/persistence
          --deselect tests/unit/persistence/test_migrations.py::test_fresh_postgresql_database_upgrades_to_head
      - name: Verify OCI and GIS capabilities
        run: |
          docker version
          docker buildx version
          docker buildx inspect --bootstrap
          command -v gdal_create
          uv run python - <<'PY'
          from grafy_plugin_gis.gdal import GdalCli

          capabilities = GdalCli().capabilities()
          required = {
              "pmtiles_write": capabilities.pmtiles_write,
              "cog_write": capabilities.cog_write,
              "png_write": capabilities.png_write,
          }
          missing = [name for name, available in required.items() if not available]
          if missing:
              raise SystemExit(f"Missing writable GDAL capabilities: {', '.join(missing)}")
          print(capabilities.model_dump_json())
          PY
      - name: Run backend tests
        run: uv run pytest
      - name: Verify presigned uploads through the gateway
        run: |
          stack=(docker compose --file infra/docker/compose.storage-gateway-test.yaml)
          trap '"${stack[@]}" down --volumes' EXIT
          "${stack[@]}" up --detach --wait
          GRAFY_TEST_S3_GATEWAY_URL=http://127.0.0.1:18080/storage \
          GRAFY_TEST_S3_ENDPOINT_URL=http://127.0.0.1:19000 \
            uv run pytest -q -o log_cli=false tests/integration/uploads/test_storage_gateway.py

  native-runtime:
    name: Native API runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the native API release image
        run: |
          digest="$(git archive HEAD | sha256sum | cut -d ' ' -f 1)"
          docker build --file infra/docker/api.Dockerfile --target api-release \
            --build-arg GRAFY_BUILD_DIGEST="$digest" --tag grafy-native-api-ci .
      - name: Persist a raster through the installed GIS family
        run: >-
          docker run --rm --network=none --entrypoint .venv/bin/python
          grafy-native-api-ci -m grafy_plugin_gis.smoke
      - name: Verify bounded subprocesses on Linux
        # The release image deliberately has no test dependencies. Use the
        # runner's locked workspace to exercise real rlimits and cancellation.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run pytest -q -o log_cli=false tests/unit/core/test_bounded_subprocess.py

  quality-contracts:
    name: Lint, type and API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Python workspace
        id: python_install
        run: uv sync --locked
      - name: Install locked web workspace
        id: web_install
        if: ${{ !cancelled() }}
        run: npm --prefix apps/web ci
      - name: Validate repository hooks
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' && steps.web_install.outcome == 'success' }}
        run: uv run prek run --all-files
      - name: Python lint
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: uv run ruff check apps/api/src libs/client/src libs/core/src libs/persistence/src libs/storage/src plugins/*/src infra/db/migrations scripts tests
      - name: Client typecheck
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: uv run pyright libs/client
      - name: Web lint
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run lint
      - name: Web format
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        working-directory: apps/web
        run: npm exec prettier -- --check "src/**/*.{ts,tsx,css,md,json}" "e2e*/**/*.{ts,tsx}" "playwright*.config.ts"
      - name: Web typecheck
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run typecheck
      - name: Generated API contract
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run check:api

  web:
    name: Web tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web workspace
        id: web_install
        run: npm --prefix apps/web ci
      - name: Run web tests
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web test
      - name: Build production web application
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run build

  web-browser:
    name: Web browser acceptance
    env:
      FORCE_COLOR: "0"
    runs-on: ubuntu-24.04
    # Install, the falsification run, then the whole mocked-API suite on one
    # worker. The suite alone measured 8 minutes on a developer machine; the
    # publication gate must not fail on a tight clock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web workspace and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Falsify browser geometry and connection assertions
        working-directory: apps/web
        run: |
          backup="$(mktemp -d)"
          cp e2e/generated-drawer.spec.ts "$backup/geometry.ts"
          cp e2e/canvas-gestures.spec.ts "$backup/ports.ts"
          trap 'cp "$backup/geometry.ts" e2e/generated-drawer.spec.ts; cp "$backup/ports.ts" e2e/canvas-gestures.spec.ts; rm -rf "$backup"' EXIT
          python - <<'PY'
          from pathlib import Path
          p = Path("e2e/generated-drawer.spec.ts")
          s = p.read_text()
          old = "toBeLessThan(canvasBefore.width)"
          assert old in s
          p.write_text(s.replace(old, "toBeLessThan(0)"))
          p = Path("e2e/canvas-gestures.spec.ts")
          s = p.read_text()
          old = 'page.locator(".react-flow__edge")).toHaveCount(1)'
          assert old in s
          p.write_text(s.replace(old, 'page.locator(".react-flow__edge")).toHaveCount(2)'))
          PY
          if npx playwright test generated-drawer.spec.ts --project=desktop-chromium --retries=0 > "$backup/geometry.log" 2>&1; then
            cat "$backup/geometry.log"
            exit 1
          fi
          cat "$backup/geometry.log"
          grep -q "Expected: < 0" "$backup/geometry.log"
          if npx playwright test canvas-gestures.spec.ts --project=desktop-chromium --grep "ports still connect with Generated" --retries=0 > "$backup/ports.log" 2>&1; then
            cat "$backup/ports.log"
            exit 1
          fi
          cat "$backup/ports.log"
          grep -q "Expected: 2" "$backup/ports.log"
      # Every mocked-API browser spec, in every viewport project: desktop, phone
      # and tablet. One run per spec and project, with the retries and the single
      # worker the config already picks for CI.
      - name: Verify the workbench in a real browser
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failure
          path: output/playwright/

  # The mocked-API suite above never talks to FastAPI. This one does: it migrates a
  # throwaway SQLite database, starts the API, this app's dev proxy, and a disposable
  # Keycloak running the repository's realm, and lets the browser sign in and save a
  # graph for real.
  web-browser-real:
    name: Web browser smoke (real backend)
    env:
      FORCE_COLOR: "0"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # The suite needs no Plugin extras: the journey uses a builtin family, and the
      # API must start from the same minimal image set the published image ships.
      - name: Install locked Python workspace
        run: uv sync --locked
      - name: Install locked web workspace and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The launcher owns the database, ports, keys, and provider container, and removes
      # them again; Playwright owns the two service processes. `--locked` and the absent
      # `.env` keep the run off host state, and the caller's `GRAFY_*` is dropped.
      - name: Sign in and save a graph against a real API
        working-directory: apps/web
        run: npm run test:e2e:real
      # Deliberately only the Playwright output: the run's database, keys, and service
      # logs live in the OS temp directory and are never a workspace file. Traces are
      # off in CI (see playwright.real.config.ts) so this artifact cannot carry the
      # run's session cookie.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-real-failure
          path: output/playwright-real/

  deployment-images:
    name: API and publisher deployment images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API release image with locked workspace
        run: |
          digest="$(git archive HEAD | sha256sum | cut -d ' ' -f 1)"
          docker build --file infra/docker/api.Dockerfile --target api-release \
            --build-arg GRAFY_BUILD_DIGEST="$digest" --tag grafy-api-ci .
      - name: Construct installed API contracts
        run: |
          docker run --rm --network=none --entrypoint .venv/bin/python grafy-api-ci -c '
          import importlib.util
          import grafy_shared.config.keys
          import grafy_api.v1.routes.library.views
          import grafy_plugin_gis, grafy_plugin_image, grafy_plugin_table
          import grafy_plugin_llm, grafy_plugin_mistral, grafy_plugin_typesafe
          assert importlib.util.find_spec("grafy_plugin_python") is None
          '
      - name: Verify API image GIS tools
        run: >-
          docker run --rm --network=none --entrypoint .venv/bin/python grafy-api-ci
          -c 'from grafy_plugin_gis.gdal import GdalCli; c = GdalCli().capabilities();
          assert c.pmtiles_write and c.cog_write and c.png_write, c;
          print(c.model_dump_json())'
      - name: Build publisher and Plugin API image
        run: docker build --file infra/docker/api.Dockerfile --target publisher --tag grafy-publisher-ci .
      - name: Construct publisher CLI and verify tools
        run: |
          docker run --rm --entrypoint .venv/bin/grafy grafy-publisher-ci --help
          docker run --rm --entrypoint docker grafy-publisher-ci buildx version

  publish-images:
    name: Publish ${{ matrix.image }} image
    # Images exist only for commits that passed every job above on main, so a
    # deployable SHA is by construction a reviewed, CI-green commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - native-runtime
      - quality-contracts
      - web
      - web-browser
      - web-browser-real
      - deployment-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: grafy-api
            dockerfile: infra/docker/api.Dockerfile
            target: api-release
          - image: grafy-publisher
            dockerfile: infra/docker/api.Dockerfile
            target: publisher
          - image: grafy-web
            dockerfile: infra/docker/web.Dockerfile
            target: runner
          - image: grafy-gateway
            dockerfile: infra/docker/gateway.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - name: Compute source archive digest
        id: source
        run: echo "digest=$(git archive HEAD | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            ${{ matrix.image == 'grafy-api' && format('GRAFY_BUILD_DIGEST={0}', steps.source.outputs.digest) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
