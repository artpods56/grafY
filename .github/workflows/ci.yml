name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grafy
          POSTGRES_USER: grafy
          POSTGRES_PASSWORD: grafy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username grafy --dbname grafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: docker/setup-docker-action@v5
        with:
          version: v28.4.0
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Install native GIS contract tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdal-bin
      - name: Install locked Python workspace
        run: uv sync --locked --all-extras
      - name: Verify fresh PostgreSQL migration
        env:
          GRAFY_TEST_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
        run: >-
          uv run --all-extras pytest -q -o log_cli=false
          tests/unit/persistence/test_migrations.py::test_fresh_postgresql_database_upgrades_to_head
      - name: Verify PostgreSQL persistence contracts
        env:
          GRAFY_TEST_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
          GRAFY_TEST_TRANSIENT_POSTGRES_URL: postgresql+asyncpg://grafy:grafy-ci@127.0.0.1:5432/grafy
        run: >-
          uv run --all-extras pytest -q -o log_cli=false tests/unit/persistence
          --deselect tests/unit/persistence/test_migrations.py::test_fresh_postgresql_database_upgrades_to_head
      - name: Verify OCI and GIS capabilities
        run: |
          docker version
          docker buildx version
          docker buildx inspect --bootstrap
          command -v gdal_create
          uv run python - <<'PY'
          from grafy_plugin_gis.gdal import GdalCli

          capabilities = GdalCli().capabilities()
          required = {
              "pmtiles_write": capabilities.pmtiles_write,
              "cog_write": capabilities.cog_write,
              "png_write": capabilities.png_write,
          }
          missing = [name for name, available in required.items() if not available]
          if missing:
              raise SystemExit(f"Missing writable GDAL capabilities: {', '.join(missing)}")
          print(capabilities.model_dump_json())
          PY
      - name: Run backend tests
        run: uv run --all-extras pytest

  native-runtime:
    name: Native Plugin runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build checked-in native runtime
        run: docker build --file infra/docker/plugin-native-runtime.Dockerfile --tag grafy-native-runtime-ci .
      - name: Verify opt-in loopback registry
        run: |
          registry_compose=(docker compose --project-name grafy-runtime-ci --file infra/docker/compose.plugin-registry.yaml)
          trap '"${registry_compose[@]}" down --volumes' EXIT
          "${registry_compose[@]}" up --detach
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5000/v2/
      - name: Exercise native runtime tools
        run: |
          docker run --rm grafy-native-runtime-ci sh -eu -c '
            uv --version
            python --version
            /usr/bin/python3 -c "from osgeo import gdal; import numpy; from PIL import Image; print(gdal.VersionInfo())"
            gdal_create -of GTiff -outsize 64 64 -bands 1 -burn 127 -a_srs EPSG:4326 -a_ullr -1 1 1 -1 /tmp/source.tif
            gdal_translate -of COG /tmp/source.tif /tmp/cog.tif
            gdalinfo /tmp/cog.tif | grep "LAYOUT=COG"
            /usr/bin/python3 /usr/bin/gdal2tiles.py --xyz --zoom=0 --processes=1 /tmp/cog.tif /tmp/tiles
            test -s /tmp/tiles/0/0/0.png
            /usr/bin/python3 -c "from PIL import Image; Image.new(\"RGB\", (256, 64), \"white\").save(\"/tmp/ocr.png\")"
            tesseract /tmp/ocr.png /tmp/ocr -l eng
            test -f /tmp/ocr.txt
          '

  quality-contracts:
    name: Lint, type and API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Python workspace
        id: python_install
        run: uv sync --locked --all-extras
      - name: Install locked web workspace
        id: web_install
        if: ${{ !cancelled() }}
        run: npm --prefix apps/web ci
      - name: Validate repository hooks
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' && steps.web_install.outcome == 'success' }}
        run: uv run prek run --all-files
      - name: Python lint
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: uv run ruff check apps/api/src libs/client/src libs/core/src libs/persistence/src libs/storage/src plugins/*/src infra/db/migrations scripts tests
      - name: Client typecheck
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' }}
        run: uv run pyright libs/client
      - name: Web lint
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run lint
      - name: Web format
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        working-directory: apps/web
        run: npm exec prettier -- --check "src/**/*.{ts,tsx,css,md,json}" "e2e/**/*.{ts,tsx}"
      - name: Web typecheck
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run typecheck
      - name: Generated API contract
        if: ${{ !cancelled() && steps.python_install.outcome == 'success' && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run check:api

  web:
    name: Web tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web workspace
        id: web_install
        run: npm --prefix apps/web ci
      - name: Run web tests
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web test
      - name: Build production web application
        if: ${{ !cancelled() && steps.web_install.outcome == 'success' }}
        run: npm --prefix apps/web run build

  generated-browser:
    name: Generated panel browser contracts
    env:
      FORCE_COLOR: "0"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web workspace and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Falsify browser geometry and connection assertions
        working-directory: apps/web
        run: |
          backup="$(mktemp -d)"
          cp e2e/generated-drawer.spec.ts "$backup/geometry.ts"
          cp e2e/canvas-gestures.spec.ts "$backup/ports.ts"
          trap 'cp "$backup/geometry.ts" e2e/generated-drawer.spec.ts; cp "$backup/ports.ts" e2e/canvas-gestures.spec.ts; rm -rf "$backup"' EXIT
          python - <<'PY'
          from pathlib import Path
          p = Path("e2e/generated-drawer.spec.ts")
          s = p.read_text()
          old = "toBeLessThan(canvasBefore.width)"
          assert old in s
          p.write_text(s.replace(old, "toBeLessThan(0)"))
          p = Path("e2e/canvas-gestures.spec.ts")
          s = p.read_text()
          old = 'page.locator(".react-flow__edge")).toHaveCount(1)'
          assert old in s
          p.write_text(s.replace(old, 'page.locator(".react-flow__edge")).toHaveCount(2)'))
          PY
          if npx playwright test generated-drawer.spec.ts --project=desktop-chromium --retries=0 > "$backup/geometry.log" 2>&1; then
            cat "$backup/geometry.log"
            exit 1
          fi
          cat "$backup/geometry.log"
          grep -q "Expected: < 0" "$backup/geometry.log"
          if npx playwright test canvas-gestures.spec.ts --project=desktop-chromium --grep "ports still connect with Generated" --retries=0 > "$backup/ports.log" 2>&1; then
            cat "$backup/ports.log"
            exit 1
          fi
          cat "$backup/ports.log"
          grep -q "Expected: 2" "$backup/ports.log"
      - name: Verify desktop and narrow Generated layout
        working-directory: apps/web
        run: npx playwright test generated-drawer.spec.ts
      - name: Verify port drag with Generated docked
        working-directory: apps/web
        run: npx playwright test canvas-gestures.spec.ts --project=desktop-chromium --grep "ports still connect with Generated"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: generated-browser-failure
          path: output/playwright/

  deployment-images:
    name: API and publisher deployment images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image with locked workspace
        run: docker build --file infra/docker/api.Dockerfile --target api --tag grafy-api-ci .
      - name: Construct installed API contracts
        run: docker run --rm --entrypoint .venv/bin/python grafy-api-ci -c 'import grafy_shared.config.keys; import grafy_api.v1.routes.library.views'
      - name: Build publisher and Plugin API image
        run: docker build --file infra/docker/api.Dockerfile --target publisher --tag grafy-publisher-ci .
      - name: Construct publisher CLI and verify tools
        run: |
          docker run --rm --entrypoint .venv/bin/grafy grafy-publisher-ci --help
          docker run --rm --entrypoint docker grafy-publisher-ci buildx version
