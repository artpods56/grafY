# Same-origin gateway contract for Grafy.
# Public paths share one authority: `/` → web, `/api/` → API.
# Terminate TLS in front of this listener (or mount certs here) before production OIDC.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;
    sendfile on;
    keepalive_timeout 65;
    # Multipart overhead sits above the exact 64 MiB per-file API limit.
    client_max_body_size 65m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream grafy_web {
        server web:3000;
    }

    upstream grafy_api {
        server api:8000;
    }

    server {
        listen 8080;
        server_name _;

        # Optional storage routes supplied by a deployment Compose override.
        include /etc/nginx/grafy-uploads/*.conf;

        # Browser UI and static assets.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafy_web;
        }

        # Strip only `/api` so public `/api/v1/...` becomes FastAPI `/v1/...`.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://grafy_api/;
        }
    }
}
