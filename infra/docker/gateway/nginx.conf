# Same-origin gateway contract for Grafy.
# Public paths share one authority: `/` → web, `/api/` → API,
# `/storage/` → presigned object uploads (S3/MinIO, see docs/deploy/upload-storage.md).
# Terminate TLS in front of this listener (or mount certs here) before production OIDC.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;
    sendfile on;
    keepalive_timeout 65;
    # Multipart overhead sits above the exact 64 MiB per-file API limit.
    client_max_body_size 65m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream grafy_web {
        server web:3000;
    }

    upstream grafy_api {
        server api:8000;
    }

    # Presigned uploads are signed for `/<bucket>/<key>` on the public host;
    # strip `/storage` from the raw request URI so the path and query reach
    # MinIO byte-for-byte. Only the artifact bucket is routable.
    map $request_uri $grafy_storage_uri {
        "~^/storage(?<grafy_storage_rest>/workbench-artifacts/[^?]+\?.+)$" $grafy_storage_rest;
        default "";
    }

    server {
        listen 8080;
        server_name _;

        # Optional storage routes supplied by a deployment Compose override.
        include /etc/nginx/grafy-uploads/*.conf;

        # Browser UI and static assets.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafy_web;
        }

        # Strip only `/api` so public `/api/v1/...` becomes FastAPI `/v1/...`.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://grafy_api/;
        }

        # Browser PUTs to presigned S3 URLs (GRAFY_S3_SIGNING_ENDPOINT_URL=
        # https://<public-host>/storage). MinIO itself stays off the public
        # network; this location is its only browser-reachable surface.
        location ^~ /storage/ {
            limit_except PUT {
                deny all;
            }
            if ($grafy_storage_uri = "") {
                return 404;
            }
            # Equals the 64 MiB GRAFY_STAGED_UPLOAD_MAX_BYTES ceiling.
            client_max_body_size 64m;
            client_body_timeout 60s;
            # Resolve MinIO per request so the gateway starts without it.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $grafy_storage_upstream minio:9000;
            proxy_http_version 1.1;
            # SigV4 signs the Host header, including any non-default port.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Request and error logs can contain signed query strings.
            access_log off;
            error_log /dev/null;
            proxy_pass http://$grafy_storage_upstream$grafy_storage_uri;
        }
    }
}
