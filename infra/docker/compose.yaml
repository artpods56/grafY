name: grafy

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: "10m"

x-persistence-environment: &persistence-environment
  GRAFY_DATABASE_URL: ${GRAFY_DOCKER_DATABASE_URL:-sqlite+aiosqlite:////data/workbench/grafy.sqlite3}
  GRAFY_WORKSPACE: /data/workbench

x-api-environment: &api-environment
  <<: *persistence-environment
  OPENAI_CUSTOM_HEADERS: ${OPENAI_CUSTOM_HEADERS:-}
  GRAFY_ENVIRONMENT: ${GRAFY_ENVIRONMENT:-development}
  # Import a configured digest, but leave the setting absent in development.
  # An empty string fails the Settings field's 64-character digest pattern.
  GRAFY_BUILD_DIGEST:
  GRAFY_LOG_LEVEL: ${GRAFY_LOG_LEVEL:-INFO}
  GRAFY_LOG_RENDERER: ${GRAFY_LOG_RENDERER:-json}
  GRAFY_PUBLIC_ORIGIN: ${GRAFY_PUBLIC_ORIGIN:-https://grafy.example.com}
  GRAFY_CORS_ORIGINS: ${GRAFY_CORS_ORIGINS:-https://grafy.example.com}
  GRAFY_OIDC_ISSUER: ${GRAFY_OIDC_ISSUER:?GRAFY_OIDC_ISSUER must be set and non-empty}
  GRAFY_OIDC_CLIENT_ID: ${GRAFY_OIDC_CLIENT_ID:?GRAFY_OIDC_CLIENT_ID must be set and non-empty}
  # A null Compose value imports the variable when present and leaves it unset
  # for public PKCE clients that do not have a client secret.
  GRAFY_OIDC_CLIENT_SECRET:
  GRAFY_OIDC_ALLOWED_SIGNING_ALGORITHMS: ${GRAFY_OIDC_ALLOWED_SIGNING_ALGORITHMS:-["RS256"]}
  GRAFY_OIDC_AUTH_WRAPPING_KEY: ${GRAFY_OIDC_AUTH_WRAPPING_KEY:?GRAFY_OIDC_AUTH_WRAPPING_KEY must be set and non-empty}
  GRAFY_OIDC_AUTH_WRAPPING_KEY_VERSION: ${GRAFY_OIDC_AUTH_WRAPPING_KEY_VERSION:-1}
  GRAFY_OIDC_DOMAIN_WORKSPACES: ${GRAFY_OIDC_DOMAIN_WORKSPACES:-}
  GRAFY_CREDENTIAL_ENCRYPTION_KEY: ${GRAFY_CREDENTIAL_ENCRYPTION_KEY:?GRAFY_CREDENTIAL_ENCRYPTION_KEY must be set and non-empty}
  GRAFY_COMMAND_HMAC_KEY: ${GRAFY_COMMAND_HMAC_KEY:?GRAFY_COMMAND_HMAC_KEY must be set and non-empty}
  GRAFY_COMMAND_HMAC_KEY_VERSION: ${GRAFY_COMMAND_HMAC_KEY_VERSION:-1}
  GRAFY_REQUIRE_SINGLE_API_OWNER: "true"
  GRAFY_MAP_MAX_CONCURRENCY: ${GRAFY_MAP_MAX_CONCURRENCY:-4}
  GRAFY_MAX_ACTIVE_EXECUTIONS: ${GRAFY_MAX_ACTIVE_EXECUTIONS:-2}
  GRAFY_STORAGE_BACKEND: ${GRAFY_STORAGE_BACKEND:-local}
  GRAFY_STORAGE_BUCKET: ${GRAFY_STORAGE_BUCKET:-workbench-artifacts}
  GRAFY_STAGED_UPLOAD_MAX_BYTES: ${GRAFY_STAGED_UPLOAD_MAX_BYTES:-67108864}
  FORWARDED_ALLOW_IPS: ${GRAFY_DOCKER_SUBNET:-172.30.0.0/24}
  GRAFY_S3_ENDPOINT_URL: ${GRAFY_S3_ENDPOINT_URL:-}
  GRAFY_S3_REGION: ${GRAFY_S3_REGION:-us-east-1}
  GRAFY_S3_ACCESS_KEY_ID: ${GRAFY_S3_ACCESS_KEY_ID:-}
  GRAFY_S3_SECRET_ACCESS_KEY: ${GRAFY_S3_SECRET_ACCESS_KEY:-}
  GRAFY_S3_FORCE_PATH_STYLE: ${GRAFY_S3_FORCE_PATH_STYLE:-false}
  # Collaboration assumes one Uvicorn process with one worker.
  WEB_CONCURRENCY: "1"

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: *persistence-environment
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafy-data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api-plugins
    environment: *api-environment
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - grafy-data:/data
    # No host ports: the same-origin gateway is the only Grafy public listener.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GRAFY_BIND_ADDRESS:-127.0.0.1}:${GRAFY_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Operator-invoked one-shot job. This is the only base-Compose service with
  # Docker authority; the long-lived API never receives the socket.
  publisher:
    profiles: ["publisher"]
    image: ${GRAFY_PUBLISHER_IMAGE:-grafy-publisher:local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api-plugins
    entrypoint: [".venv/bin/grafy"]
    command: ["plugin", "publish", "--help"]
    environment:
      <<: *persistence-environment
      GRAFY_PLUGIN_ROOTS: '["/publisher-input"]'
      GRAFY_PLUGIN_RUNTIME_PROFILE: ${GRAFY_PLUGIN_RUNTIME_PROFILE:-python-uv}
      GRAFY_PLUGIN_DOCKER_BINARY: /usr/local/bin/docker
      GRAFY_PLUGIN_PUBLISHER_SCRATCH_ROOT: ${GRAFY_PUBLISHER_SCRATCH_ROOT:-/tmp/grafy-plugin-publisher}
      GRAFY_STORAGE_BACKEND: ${GRAFY_STORAGE_BACKEND:-local}
      GRAFY_STORAGE_BUCKET: ${GRAFY_STORAGE_BUCKET:-workbench-artifacts}
      GRAFY_S3_ENDPOINT_URL: ${GRAFY_S3_ENDPOINT_URL:-}
      GRAFY_S3_REGION: ${GRAFY_S3_REGION:-us-east-1}
      GRAFY_S3_ACCESS_KEY_ID: ${GRAFY_S3_ACCESS_KEY_ID:-}
      GRAFY_S3_SECRET_ACCESS_KEY: ${GRAFY_S3_SECRET_ACCESS_KEY:-}
      GRAFY_S3_FORCE_PATH_STYLE: ${GRAFY_S3_FORCE_PATH_STYLE:-false}
    init: true
    logging: *default-logging
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GRAFY_PUBLISHER_SOURCE_ROOT:-../../plugins}:/publisher-input:ro
      # The inner sandbox containers are Docker siblings. Mount this absolute
      # path at the same path so the daemon can resolve frozen snapshot binds.
      - ${GRAFY_PUBLISHER_SCRATCH_ROOT:-/tmp/grafy-plugin-publisher}:${GRAFY_PUBLISHER_SCRATCH_ROOT:-/tmp/grafy-plugin-publisher}

volumes:
  grafy-data:
    name: ${GRAFY_DATA_VOLUME:-grafy-data}

networks:
  default:
    name: ${GRAFY_DOCKER_NETWORK:-grafy-internal}
    ipam:
      config:
        - subnet: ${GRAFY_DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${GRAFY_DOCKER_GATEWAY:-172.30.0.1}
