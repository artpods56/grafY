name: grafy

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: "10m"

x-persistence-environment: &persistence-environment
  GRAFY_DATABASE_URL: ${GRAFY_DOCKER_DATABASE_URL:-sqlite+aiosqlite:////data/workbench/grafy.sqlite3}
  GRAFY_WORKSPACE: /data/workbench

x-api-environment: &api-environment
  <<: *persistence-environment
  OPENAI_CUSTOM_HEADERS: ${OPENAI_CUSTOM_HEADERS:-}
  # A null Compose value imports the variable when present and leaves it unset.
  # AgentsConfig does not treat an empty string as unset: an empty
  # GRAFY_AGENT_DEFAULT_BASE_URL fails API startup. Set all three, or none.
  GRAFY_AGENT_DEFAULT_BASE_URL:
  GRAFY_AGENT_DEFAULT_MODEL:
  GRAFY_AGENT_DEFAULT_API_KEY:
  GRAFY_ENVIRONMENT: ${GRAFY_ENVIRONMENT:-development}
  GRAFY_LOG_LEVEL: ${GRAFY_LOG_LEVEL:-INFO}
  GRAFY_LOG_RENDERER: ${GRAFY_LOG_RENDERER:-json}
  GRAFY_PUBLIC_ORIGIN: ${GRAFY_PUBLIC_ORIGIN:-https://grafy.example.com}
  GRAFY_CORS_ORIGINS: ${GRAFY_CORS_ORIGINS:-https://grafy.example.com}
  GRAFY_OIDC_ISSUER: ${GRAFY_OIDC_ISSUER:?GRAFY_OIDC_ISSUER must be set and non-empty}
  GRAFY_OIDC_CLIENT_ID: ${GRAFY_OIDC_CLIENT_ID:?GRAFY_OIDC_CLIENT_ID must be set and non-empty}
  # A null Compose value imports the variable when present and leaves it unset
  # for public PKCE clients that do not have a client secret.
  GRAFY_OIDC_CLIENT_SECRET:
  GRAFY_OIDC_ALLOWED_SIGNING_ALGORITHMS: ${GRAFY_OIDC_ALLOWED_SIGNING_ALGORITHMS:-["RS256"]}
  GRAFY_OIDC_AUTH_WRAPPING_KEY: ${GRAFY_OIDC_AUTH_WRAPPING_KEY:?GRAFY_OIDC_AUTH_WRAPPING_KEY must be set and non-empty}
  GRAFY_OIDC_AUTH_WRAPPING_KEY_VERSION: ${GRAFY_OIDC_AUTH_WRAPPING_KEY_VERSION:-1}
  GRAFY_OIDC_DOMAIN_WORKSPACES: ${GRAFY_OIDC_DOMAIN_WORKSPACES:-}
  GRAFY_CATALOG_CONFIG: ${GRAFY_CATALOG_CONFIG:-}
  GRAFY_OPERATOR_EMAILS: ${GRAFY_OPERATOR_EMAILS:-}
  GRAFY_CREDENTIAL_ENCRYPTION_KEY: ${GRAFY_CREDENTIAL_ENCRYPTION_KEY:?GRAFY_CREDENTIAL_ENCRYPTION_KEY must be set and non-empty}
  GRAFY_COMMAND_HMAC_KEY: ${GRAFY_COMMAND_HMAC_KEY:?GRAFY_COMMAND_HMAC_KEY must be set and non-empty}
  GRAFY_COMMAND_HMAC_KEY_VERSION: ${GRAFY_COMMAND_HMAC_KEY_VERSION:-1}
  GRAFY_REQUIRE_SINGLE_API_OWNER: "true"
  GRAFY_EGRESS_TRUSTED_DESTINATIONS: ${GRAFY_EGRESS_TRUSTED_DESTINATIONS:-[]}
  GRAFY_MAP_MAX_CONCURRENCY: ${GRAFY_MAP_MAX_CONCURRENCY:-4}
  GRAFY_PROJECT_COMPUTATION_CONCURRENCY: ${GRAFY_PROJECT_COMPUTATION_CONCURRENCY:-2}
  GRAFY_TILER_URL: ${GRAFY_TILER_URL:-}
  GRAFY_TILER_SHARED_KEY: ${GRAFY_TILER_SHARED_KEY:-}
  GRAFY_TILER_RENDERER_VERSION: ${GRAFY_TILER_RENDERER_VERSION:-1}
  GRAFY_TILER_INFO_TIMEOUT_SECONDS: ${GRAFY_TILER_INFO_TIMEOUT_SECONDS:-30}
  GRAFY_TILER_TIMEOUT_SECONDS: ${GRAFY_TILER_TIMEOUT_SECONDS:-10}
  GRAFY_STORAGE_BACKEND: ${GRAFY_STORAGE_BACKEND:-local}
  GRAFY_STORAGE_BUCKET: ${GRAFY_STORAGE_BUCKET:-workbench-artifacts}
  GRAFY_STAGED_UPLOAD_MAX_BYTES: ${GRAFY_STAGED_UPLOAD_MAX_BYTES:-67108864}
  FORWARDED_ALLOW_IPS: ${GRAFY_DOCKER_SUBNET:-172.30.0.0/24}
  GRAFY_S3_ENDPOINT_URL: ${GRAFY_S3_ENDPOINT_URL:-}
  # Browser-facing upload origin, normally `${GRAFY_PUBLIC_ORIGIN}/storage`.
  GRAFY_S3_SIGNING_ENDPOINT_URL: ${GRAFY_S3_SIGNING_ENDPOINT_URL:-}
  GRAFY_S3_REGION: ${GRAFY_S3_REGION:-us-east-1}
  GRAFY_S3_ACCESS_KEY_ID: ${GRAFY_S3_ACCESS_KEY_ID:-}
  GRAFY_S3_SECRET_ACCESS_KEY: ${GRAFY_S3_SECRET_ACCESS_KEY:-}
  GRAFY_S3_FORCE_PATH_STYLE: ${GRAFY_S3_FORCE_PATH_STYLE:-false}
  # Collaboration assumes one Uvicorn process with one worker.
  WEB_CONCURRENCY: "1"

services:
  migrate:
    image: ${GRAFY_API_IMAGE:-grafy-api:local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: *persistence-environment
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafy-data:/data

  api:
    image: ${GRAFY_API_IMAGE:-grafy-api:local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    environment: *api-environment
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - grafy-data:/data
    # No host ports: the same-origin gateway is the only Grafy public listener.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${GRAFY_WEB_IMAGE:-grafy-web:local}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: ${GRAFY_GATEWAY_IMAGE:-grafy-gateway:local}
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    ports:
      - "${GRAFY_BIND_ADDRESS:-127.0.0.1}:${GRAFY_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Internal tile service for TIFF artifacts (apps/tiler, docs/design/
  # tiff-on-demand-tiles.md). No host port and no route from the gateway: only
  # the API reaches it, with an HMAC grant it signs per request. It cannot
  # fetch arbitrary URLs and reads only the artifact bucket, read-only.
  tiler:
    image: ${GRAFY_TILER_IMAGE:-grafy-tiler:local}
    build:
      context: ../..
      dockerfile: infra/docker/tiler.Dockerfile
      target: tiler
    environment:
      # Shared with the API's signer. Comma-separate two keys to rotate.
      TILER_SIGNING_KEYS: ${GRAFY_TILER_SHARED_KEY:?GRAFY_TILER_SHARED_KEY must be set and non-empty}
      TILER_BUCKET: ${GRAFY_STORAGE_BUCKET:-workbench-artifacts}
      # `local` reads the API's file store from the read-only /data mount;
      # `s3` reads the bucket through GDAL with the read-only account below.
      TILER_STORAGE: ${GRAFY_STORAGE_BACKEND:-local}
      TILER_LOCAL_ROOT: /data/workbench/objects
      TILER_S3_ENDPOINT_URL: ${GRAFY_S3_ENDPOINT_URL:-}
      TILER_S3_REGION: ${GRAFY_S3_REGION:-us-east-1}
      TILER_S3_FORCE_PATH_STYLE: ${GRAFY_S3_FORCE_PATH_STYLE:-false}
      # A read-only MinIO account of its own: never the API's read-write key.
      TILER_S3_ACCESS_KEY_ID: ${GRAFY_TILER_S3_ACCESS_KEY_ID:-}
      TILER_S3_SECRET_ACCESS_KEY: ${GRAFY_TILER_S3_SECRET_ACCESS_KEY:-}
      TILER_CACHE_MAX_BYTES: ${GRAFY_TILER_CACHE_MAX_BYTES:-2147483648}
      TILER_WORKERS: ${GRAFY_TILER_WORKERS:-1}
      TILER_RENDER_CONCURRENCY: ${GRAFY_TILER_RENDER_CONCURRENCY:-2}
      TILER_QUEUE_DEPTH: ${GRAFY_TILER_QUEUE_DEPTH:-32}
    cpus: ${GRAFY_TILER_CPUS:-2}
    mem_limit: ${GRAFY_TILER_MEMORY:-1536m}
    pids_limit: 256
    init: true
    logging: *default-logging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    volumes:
      - grafy-tiler-cache:/cache
      - grafy-data:/data:ro
    expose:
      - "8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  grafy-data:
    name: ${GRAFY_DATA_VOLUME:-grafy-data}
  grafy-tiler-cache:
    name: ${GRAFY_TILER_CACHE_VOLUME:-grafy-tiler-cache}

networks:
  default:
    name: ${GRAFY_DOCKER_NETWORK:-grafy-internal}
    ipam:
      config:
        - subnet: ${GRAFY_DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${GRAFY_DOCKER_GATEWAY:-172.30.0.1}
