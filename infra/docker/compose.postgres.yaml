# Opt-in production persistence for Grafy. Merge this file after compose.yaml.
services:
  postgres:
    image: ${GRAFY_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${GRAFY_POSTGRES_DB:-grafy}
      POSTGRES_USER: ${GRAFY_POSTGRES_USER:-grafy}
      POSTGRES_PASSWORD: ${GRAFY_POSTGRES_PASSWORD:?GRAFY_POSTGRES_PASSWORD must be set and non-empty}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    restart: unless-stopped
    volumes:
      - grafy-postgres:/var/lib/postgresql/data

  migrate:
    environment:
      GRAFY_DATABASE_URL: postgresql+asyncpg://${GRAFY_POSTGRES_USER:-grafy}:${GRAFY_POSTGRES_PASSWORD:?GRAFY_POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${GRAFY_POSTGRES_DB:-grafy}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      GRAFY_DATABASE_URL: postgresql+asyncpg://${GRAFY_POSTGRES_USER:-grafy}:${GRAFY_POSTGRES_PASSWORD:?GRAFY_POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${GRAFY_POSTGRES_DB:-grafy}
      GRAFY_ENVIRONMENT: ${GRAFY_ENVIRONMENT:-production}
      GRAFY_BUILD_DIGEST: ${GRAFY_BUILD_DIGEST:?GRAFY_BUILD_DIGEST must be set to the 64-character source archive SHA-256}

  publisher:
    environment:
      GRAFY_DATABASE_URL: postgresql+asyncpg://${GRAFY_POSTGRES_USER:-grafy}:${GRAFY_POSTGRES_PASSWORD:?GRAFY_POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${GRAFY_POSTGRES_DB:-grafy}

volumes:
  grafy-postgres:
    name: ${GRAFY_POSTGRES_VOLUME:-grafy-postgres}
