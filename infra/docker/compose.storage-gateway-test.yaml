# Throwaway MinIO behind the real gateway config. Proves that presigned
# uploads signed for `${origin}/storage` survive the `/storage` prefix strip:
#
#   docker compose -f infra/docker/compose.storage-gateway-test.yaml up --detach --wait
#   GRAFY_TEST_S3_GATEWAY_URL=http://127.0.0.1:18080/storage \
#   GRAFY_TEST_S3_ENDPOINT_URL=http://127.0.0.1:19000 \
#     uv run pytest tests/integration/uploads/test_storage_gateway.py
#
# `just test-storage-gateway` runs the same sequence.
name: grafy-storage-gateway-test

services:
  minio:
    # quay.io/minio/minio is no longer anonymously pullable; Chainguard's
    # anonymously pullable MinIO build is the pinned replacement. It ships no
    # `mc` or curl, so the healthcheck probes the readiness endpoint over bash.
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${GRAFY_TEST_MINIO_PORT:-19000}:9000"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 2s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # Web and API are not under test; the upstream names only need to resolve.
    extra_hosts:
      - "web:127.0.0.1"
      - "api:127.0.0.1"
    ports:
      - "127.0.0.1:${GRAFY_TEST_GATEWAY_PORT:-18080}:8080"
    depends_on:
      minio:
        condition: service_healthy
