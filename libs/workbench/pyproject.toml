[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-workbench"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "grafy-core",
    "pydantic",
]

[tool.uv.sources]
grafy-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"grafy_workbench.presets" = ["*.toml"]
