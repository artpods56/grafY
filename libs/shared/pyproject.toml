[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-shared"
version = "0.1.0"
requires-python = "==3.14.*"
# grafy-shared is a leaf: it turns the environment into typed values and imports
# nothing else from this workspace, so every other layer can import its own
# configuration without a cycle. See docs/adr/0011.
dependencies = [
    "pydantic",
    "pydantic-settings>=2.12.0",
]

[tool.basedpyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
