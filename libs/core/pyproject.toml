[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-core"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.23.0",
    "pydantic",
    "referencing>=0.36.2",
]

[tool.basedpyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
