[project]
name = "grafy-workspace"
version = "0.1.0"
description = "Grafy typed artifact-graph workbench"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "grafy-api",
    "grafy-client",
    "grafy-core",
    "grafy-persistence",
    "grafy-workbench",
    "grafy-storage",
    "grafy-shared",
    "grafy-plugin-gis",
    "grafy-plugin-image",
    "grafy-plugin-llm",
    "grafy-plugin-mistral",
    "grafy-plugin-sql",
    "grafy-plugin-table",
    "grafy-plugin-typesafe",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/client",
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "libs/workbench",
    "libs/shared",
    "apps/api",
    "apps/plugin-egress-broker",
    "plugins/gis",
    "plugins/image",
    "plugins/llm",
    "plugins/mistral",
    "plugins/sql",
    "plugins/table",
    "plugins/typesafe",
]
exclude = [
    "tests/fixtures/plugin-notes",
]

[tool.uv.sources]
grafy-plugin-egress-broker = { workspace = true }
grafy-api = { workspace = true }
grafy-client = { workspace = true }
grafy-core = { workspace = true }
grafy-persistence = { workspace = true }
grafy-storage = { workspace = true }
grafy-workbench = { workspace = true }
grafy-shared = { workspace = true }
grafy-plugin-gis = { workspace = true }
grafy-plugin-image = { workspace = true }
grafy-plugin-llm = { workspace = true }
grafy-plugin-mistral = { workspace = true }
grafy-plugin-sql = { workspace = true }
grafy-plugin-table = { workspace = true }
grafy-plugin-typesafe = { workspace = true }

[dependency-groups]
dev = [
    "grafy-plugin-egress-broker",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "polyfactory>=3.3.0",
    "pyright>=1.1.411",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
    "prek==0.5.4",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "libs/client/*",
    "libs/core/*",
    "libs/persistence/*",
    "libs/storage/*",
    "libs/workbench/*",
    "libs/shared/*",
    "plugins/image/*",
    "plugins/table/*",
    "plugins/llm/*",
    "plugins/mistral/*",
    "plugins/gis/*",
    "plugins/sql/*",
    "plugins/typesafe/*",
    "apps/api/*",
    "apps/plugin-egress-broker/*",
    "tests/*",
]
exclude = [
    "**/.venv",
    "**/build",
    "**/dist",
    ".grafy-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/client/src",
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "libs/workbench/src",
        "libs/shared/src",
        "plugins/image/src",
        "plugins/table/src",
        "plugins/llm/src",
        "plugins/mistral/src",
        "plugins/gis/src",
        "plugins/sql/src",
        "plugins/typesafe/src",
        "apps/api/src",
        "apps/plugin-egress-broker/src",
    ] },
]
