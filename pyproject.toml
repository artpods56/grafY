[project]
name = "grafy-workspace"
version = "0.1.0"
description = "Grafy typed artifact-graph workbench"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "grafy-api",
    "grafy-client",
    "grafy-core",
    "grafy-persistence",
    "grafy-workbench",
    "grafy-storage",
]

[project.optional-dependencies]
gis = ["grafy-plugin-gis"]
llm = ["grafy-plugin-llm"]
ocr = ["grafy-plugin-ocr"]
sql = ["grafy-plugin-sql"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/client",
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "libs/workbench",
    "apps/api",
    "apps/plugin-egress-broker",
]
exclude = [
    "examples/plugin-notes",
    "plugins/gis",
    "plugins/llm",
    "plugins/ocr",
    "plugins/sql",
]

[tool.uv.sources]
grafy-plugin-egress-broker = { workspace = true }
grafy-api = { workspace = true }
grafy-client = { workspace = true }
grafy-core = { workspace = true }
grafy-persistence = { workspace = true }
grafy-storage = { workspace = true }
grafy-workbench = { workspace = true }
grafy-plugin-llm = { path = "plugins/llm" }
grafy-plugin-ocr = { path = "plugins/ocr" }
grafy-plugin-gis = { path = "plugins/gis" }
grafy-plugin-sql = { path = "plugins/sql" }

[dependency-groups]
dev = [
    "grafy-plugin-egress-broker",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "polyfactory>=3.3.0",
    "pyright>=1.1.411",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "libs/client/*",
    "libs/core/*",
    "libs/persistence/*",
    "libs/storage/*",
    "libs/workbench/*",
    "plugins/llm/*",
    "plugins/ocr/*",
    "plugins/gis/*",
    "plugins/sql/*",
    "apps/api/*",
    "apps/plugin-egress-broker/*",
    "tests/*",
]
exclude = [
    "**/.venv",
    "**/build",
    "**/dist",
    ".grafy-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/client/src",
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "libs/workbench/src",
        "plugins/llm/src",
        "plugins/ocr/src",
        "plugins/gis/src",
        "plugins/sql/src",
        "apps/api/src",
        "apps/plugin-egress-broker/src",
    ] },
]
