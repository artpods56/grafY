[project]
name = "grafy-workspace"
version = "0.1.0"
description = "Grafy typed artifact-graph workbench"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "grafy-api",
    "grafy-client",
    "grafy-core",
    "grafy-persistence",
    "grafy-workbench",
    "grafy-storage",
    "grafy-shared",
]

[project.optional-dependencies]
gis = ["grafy-plugin-gis"]
llm = ["grafy-plugin-llm"]
mistral = ["grafy-plugin-mistral"]
ocr = ["grafy-plugin-ocr"]
python = ["grafy-plugin-python"]
sql = ["grafy-plugin-sql"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/client",
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "libs/workbench",
    "libs/shared",
    "apps/api",
    "apps/plugin-egress-broker",
]
exclude = [
    "examples/plugin-notes",
    "plugins/gis",
    "plugins/llm",
    "plugins/mistral",
    "plugins/ocr",
    "plugins/python",
    "plugins/sql",
]

[tool.uv.sources]
grafy-plugin-egress-broker = { workspace = true }
grafy-api = { workspace = true }
grafy-client = { workspace = true }
grafy-core = { workspace = true }
grafy-persistence = { workspace = true }
grafy-storage = { workspace = true }
grafy-workbench = { workspace = true }
grafy-shared = { workspace = true }
# The Plugin projects stay out of the workspace so their own environments keep
# resolving grafy_core from the vendored wheels in plugins/*/wheels. The root
# workspace still imports them for tests, lint, and type checks, and a
# non-editable path install is a snapshot: uv reports "Checked 110 packages"
# and never rebuilds it after plugins/*/src changes, so the monorepo silently
# tests stale Plugin code. Editable keeps the root import pointed at source.
grafy-plugin-llm = { path = "plugins/llm", editable = true }
grafy-plugin-mistral = { path = "plugins/mistral", editable = true }
grafy-plugin-ocr = { path = "plugins/ocr", editable = true }
grafy-plugin-gis = { path = "plugins/gis", editable = true }
grafy-plugin-python = { path = "plugins/python", editable = true }
grafy-plugin-sql = { path = "plugins/sql", editable = true }

[dependency-groups]
dev = [
    "grafy-plugin-egress-broker",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "polyfactory>=3.3.0",
    "pyright>=1.1.411",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
    "prek==0.5.4",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "libs/client/*",
    "libs/core/*",
    "libs/persistence/*",
    "libs/storage/*",
    "libs/workbench/*",
    "libs/shared/*",
    "plugins/llm/*",
    "plugins/mistral/*",
    "plugins/ocr/*",
    "plugins/gis/*",
    "plugins/python/*",
    "plugins/sql/*",
    "apps/api/*",
    "apps/plugin-egress-broker/*",
    "tests/*",
]
exclude = [
    "**/.venv",
    "**/build",
    "**/dist",
    ".grafy-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/client/src",
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "libs/workbench/src",
        "libs/shared/src",
        "plugins/llm/src",
        "plugins/mistral/src",
        "plugins/ocr/src",
        "plugins/gis/src",
        "plugins/python/src",
        "plugins/sql/src",
        "apps/api/src",
        "apps/plugin-egress-broker/src",
    ] },
]
