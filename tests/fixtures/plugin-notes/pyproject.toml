[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-plugin-notes"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "grafy-core==0.1.0",
    "pydantic",
]
description = "Example Workspace Plugin: uv project, no host entry point"

# Intentionally no generic Plugin package entry point. FastAPI must not import
# this package. Publication is a freeze of this tree, not sys.path.
# The versioned Grafy Plugin SDK wheel (grafy-core) is vendored under wheels/
# so the project and its uv.lock are self-contained; deployments that host
# their own SDK wheelhouse may instead resolve grapy-core from it through the
# configured UV_FIND_LINKS wheelhouse. Monorepo-relative path dependencies
# are rejected by publication.

[tool.uv.sources]
grafy-core = { path = "wheels/grafy_core-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
