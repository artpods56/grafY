schema_version = 1

# Allow provider-backed Plugins to contact public HTTPS origins declared as
# fixed destinations or supplied through declared config fields. An assignment
# selects a Plugin slug and revision; every release is System-owned (ADR 0015).
[profiles.plugin-execution.configured-public]
mode = "configured-public"
public_address_only = true
https_only = true
max_origins_per_execution = 1

[[assignments]]
plane = "plugin-execution"
slug = "external.llm"
profile = "configured-public"

[[assignments]]
plane = "plugin-execution"
slug = "external.mistral"
profile = "configured-public"

[[assignments]]
plane = "plugin-execution"
slug = "external.typesafe"
profile = "configured-public"
