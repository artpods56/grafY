schema_version = 1

# Allow provider-backed Plugins to contact public HTTPS origins declared as
# fixed destinations or supplied through declared config fields. The current policy
# schema calls globally published Plugins "system" scoped.
[profiles.plugin-execution.configured-public]
mode = "configured-public"
public_address_only = true
https_only = true
max_origins_per_execution = 1

[profiles.plugin-execution.notarius-configured-public]
mode = "configured-public"
public_address_only = true
https_only = true
max_origins_per_execution = 1
idle_timeout_seconds = 300

[[assignments]]
plane = "plugin-execution"
scope = "system"
slug = "external.llm"
profile = "configured-public"

