schema_version = 1

[[plugins]]
slug = "external.gis"
project = "plugins/gis"
distribution_name = "grafy-plugin-gis"
loader_target = "grafy_plugin_gis.plugin:GIS"
execution_policy = "isolated-only"
capabilities = ["native.gdal", "network.egress"]
operator_prefixes = ["gis"]
artifact_type_prefixes = ["geo"]

[[plugins]]
slug = "external.llm"
project = "plugins/llm"
distribution_name = "grafy-plugin-llm"
loader_target = "grafy_plugin_llm.plugin:LLM"
execution_policy = "isolated-only"
capabilities = ["network.egress", "node.secrets"]
operator_prefixes = ["llm", "prompt"]
artifact_type_prefixes = ["llm", "prompt.message"]

[[plugins]]
slug = "external.ocr"
project = "plugins/ocr"
distribution_name = "grafy-plugin-ocr"
loader_target = "grafy_plugin_ocr.plugin:OCR"
execution_policy = "isolated-only"
capabilities = ["native.tesseract"]
operator_prefixes = ["ocr"]
artifact_type_prefixes = ["ocr"]

[[plugins]]
slug = "external.sql"
project = "plugins/sql"
distribution_name = "grafy-plugin-sql"
loader_target = "grafy_plugin_sql.plugin:SQL"
execution_policy = "isolated-only"
capabilities = ["node.secrets", "postgresql.egress", "sql.untrusted"]
operator_prefixes = ["sql"]
artifact_type_prefixes = ["sql"]
