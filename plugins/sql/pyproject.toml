[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-plugin-sql"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "asyncpg>=0.30.0",
    "duckdb==1.5.5",
    "grafy-core==0.1.0",
    "pydantic",
    "pytz>=2024.1",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
extends = "../../pyproject.toml"
venvPath = "."
venv = ".venv"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
grafy-core = { workspace = true }
