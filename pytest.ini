[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s %(name)s: %(message)s
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests libs/workbench/tests plugins
addopts = --import-mode=importlib
markers =
    single_api_owner: exercise the exclusive one-API-owner startup lease

# A hang used to be invisible: the suite has no deadline, so a deadlock in a Project
# room cost the whole CI job timeout and produced no traceback -- two runs on this
# branch were cancelled 18 minutes apart from each other at two *different* tests,
# which is a teardown deadlock, not a bad test. The thread method dumps every thread
# before it kills the process, so the next one names the frame that blocked.
# Per-test caps belong in the individual test, not here.
timeout = 120
timeout_method = thread
